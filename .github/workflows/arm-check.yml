name: Check hosted arm64 runner

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Print runner and tool info
        run: |
          echo "--- uname -a ---"
          uname -a
          echo "--- uname -m ---"
          uname -m
          echo "--- lscpu ---"
          lscpu || true
          echo "--- node/npm versions ---"
          node -v || echo "node not installed"
          npm -v || echo "npm not installed"
